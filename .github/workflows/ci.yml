name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Pytest (no slim download)
        run: python -m pytest tests/ -q
        env:
          # CI must not fetch the 55 MB release asset.
          PERSONACORE_SLIM: ""
